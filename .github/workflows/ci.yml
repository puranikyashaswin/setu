name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      # Repo/org vars must not flip production auth guards during unit tests.
      RENDER: ""
      SETU_ENV: "test"
      ENV: "test"
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Persistence smoke
        run: python ../scripts/smoke_persist.py
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example.com
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed local env files
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then echo ".env is tracked"; exit 1; fi
          if git ls-files --error-unmatch web/.env.local >/dev/null 2>&1; then echo "web/.env.local is tracked"; exit 1; fi
          echo "ok: env files not tracked"

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Voice Health smoke
        run: npm run test:e2e
        env:
          CI: "1"
          NEXT_PUBLIC_API_URL: https://example.com

