services:
  - type: web
    name: setu-api
    runtime: python
    rootDir: api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Uncomment when upgrading to Starter plan for persistent storage.
    # disk:
    #   name: setu-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: SARVAM_API_KEY
        sync: false
      - key: OCR_TIMEOUT_SECONDS
        value: "15"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: EXPOSE_MAGIC_LINK
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Voice v2: legacy_client (default) | server_vad_v1. Flip after phone validation.
      - key: VOICE_TURN_MODE
        value: "legacy_client"
      # Server VAD engine: webrtc (default) | silero (lazy, falls back to webrtc).
      - key: SERVER_VAD_ENGINE
        value: "webrtc"
      # Uncomment when upgrading to Starter plan for persistent storage.
      # - key: DB_PATH
      #   value: /data/setu.db
      # - key: CACHE_PATH
      #   value: /data/cache
